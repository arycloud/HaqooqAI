name: haqooqai_mobile
description: "HaqooqAI - Your AI-Powered Legal Assistant for Pakistani Law"

# Prevent accidental publishing to pub.dev
publish_to: 'none'

# Version and build number for the application
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  material_color_utilities: ^0.11.1

  # State Management
  provider: ^6.1.2

  tuple: ^2.0.2


  # HTTP & API Communication
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  json_annotation: ^4.9.0

  # Secure Storage & Local Data
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^14.2.0

  # Authentication & OAuth
  url_launcher: ^6.3.0
  webview_flutter: ^4.7.0
  app_links: ^6.1.4

  # UI Components & Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.0
  logger: ^2.3.0
  connectivity_plus: ^6.0.3

  # Markdown & Text Processing
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting & Code Quality
  flutter_lints: ^5.0.0
  very_good_analysis: ^6.0.0

  # Code Generation
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
